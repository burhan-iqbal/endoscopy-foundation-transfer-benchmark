  optimizer: adamw
  weight_decay: 0.01
  lr_finetune: 0.0001
  lr_head: 0.001
  warmup_epochs: 2
  batch_size: 32
  num_workers: 4
  use_class_weights: true
  amp: true
split_csv: /home/dissertation_project/data/splits/low_label_100_seed_1.csv
run_tag: label_100
versions:
  torch: 2.13.0+cu126
  torchvision: 0.28.0+cu126
  timm: 1.0.27
  numpy: 2.5.1
