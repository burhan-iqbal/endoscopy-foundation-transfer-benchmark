model: dinov2_vits14
label_frac: 1.0
seed: 1
model_cfg:
  family: generic_ssl
  backbone: dinov2_vits14
  pretrained: true
  train_mode: frozen_head
  input_size: 224
  head: linear
training:
  max_epochs: 50
  early_stopping_patience: 10
