model: endo_fm
label_frac: 1.0
seed: 0
model_cfg:
  family: endoscopy_fm
  backbone: endo_fm
  pretrained: true
  train_mode: frozen_head
  input_size: 224
  head: linear
  weights_path: models/external_weights/endo_fm.pth
training:
  max_epochs: 50
  early_stopping_patience: 10
  selection_metric: val_auroc
  optimizer: adamw
  weight_decay: 0.01
  lr_finetune: 0.0001
  lr_head: 0.001
  warmup_epochs: 2
  batch_size: 32
  num_workers: 4
  use_class_weights: true
  amp: true
split_csv: /home/dissertation_project/data/splits/image_level_main_split.csv
run_tag: image_level
versions:
  torch: 2.13.0+cu126
  torchvision: 0.28.0+cu126
  timm: 1.0.27
  numpy: 2.5.1
